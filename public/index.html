<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nekto Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { width: 480px; max-width: 100%; padding: 20px; background: #121212; border-radius: 24px; border: 1px solid #2a2a2a; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; color: #ff0044; }
    .status { font-size: 14px; color: #66ff66; }
    .chat { background: #1a1a1a; border-radius: 16px; padding: 20px; text-align: center; min-height: 200px; border: 1px solid #2a2a2a; }
    .chat .avatar { font-size: 64px; margin-bottom: 8px; }
    .chat .name { font-size: 20px; font-weight: 600; }
    .chat .id { font-size: 14px; color: #888; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }
    .btn { background: #2a2a2a; border: none; color: #fff; padding: 10px 18px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; flex: 1 0 auto; min-width: 70px; }
    .btn:hover { background: #3a3a3a; }
    .btn-primary { background: #ff0044; }
    .btn-primary:hover { background: #cc0033; }
    .btn-danger { background: #cc0033; }
    .btn-danger:hover { background: #990022; }
    .log { margin-top: 16px; background: #0d0d0d; border-radius: 12px; padding: 8px; font-size: 12px; font-family: monospace; max-height: 80px; overflow-y: auto; color: #888; border: 1px solid #1a1a1a; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Nekto Control</h1>
    <span class="status" id="status">🔴 офлайн</span>
  </div>

  <div class="chat" id="chat">
    <div class="avatar">👤</div>
    <div class="name" id="userName">Никто не подключён</div>
    <div class="id" id="userId">Ожидание...</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="nextBtn">▶ Следующий</button>
    <button class="btn" id="micBtn">🎤 Микрофон</button>
    <button class="btn" id="muteBtn">🔇 Заглушить</button>
    <button class="btn btn-danger" id="kickBtn">🚫 Кикнуть</button>
  </div>

  <div class="log" id="logBox">[⚡] Готов к работе.</div>
</div>

<script>
  (function() {
    const logBox = document.getElementById('logBox');
    const statusDiv = document.getElementById('status');
    const userName = document.getElementById('userName');
    const userId = document.getElementById('userId');
    let ws = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<div>${time} ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text, online = false) {
      statusDiv.textContent = text;
      statusDiv.style.color = online ? '#66ff66' : '#ff4444';
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        log('Подключено к серверу');
        setStatus('✅ онлайн', true);
      };

      ws.onmessage = (e) => {
        const data = e.data;
        log('📩 ' + data);
        try {
          const parsed = JSON.parse(data);
          if (parsed.cmd === 'user_connected') {
            userName.textContent = 'Собеседник';
            userId.textContent = 'ID: ' + parsed.userId;
          }
          if (parsed.cmd === 'user_disconnected') {
            userName.textContent = 'Никто не подключён';
            userId.textContent = 'Ожидание...';
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        log('Соединение потеряно');
        setStatus('🔴 офлайн', false);
        setTimeout(connect, 3000);
      };
    }

    function sendCommand(cmd, param = '') {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('⚠️ Нет соединения');
        return;
      }
      ws.send(JSON.stringify({ cmd, param }));
      log('➡️ ' + cmd + (param ? ' ' + param : ''));
    }

    document.getElementById('nextBtn').addEventListener('click', () => sendCommand('next'));
    document.getElementById('micBtn').addEventListener('click', () => sendCommand('toggle_mic'));
    document.getElementById('muteBtn').addEventListener('click', () => sendCommand('mute'));
    document.getElementById('kickBtn').addEventListener('click', () => sendCommand('kick'));

    connect();
  })();
</script>
</body>
</html>
